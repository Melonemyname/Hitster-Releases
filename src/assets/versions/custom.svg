<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Hitster Version">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#151f2f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c0cc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="180" fill="#0b111b" stroke="#1fa7f1" stroke-width="16"/>
  <circle cx="300" cy="300" r="120" fill="url(#ring)" stroke="#5e6773" stroke-width="12"/>
  <circle cx="300" cy="300" r="54" fill="#141414"/>
  <text x="50%" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#ff4da6">HITSTER</text>
  <text x="50%" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#8be9ff">VERSION</text>
</svg>